  <link rel="icon" type="image/png" sizes="32x32" href="/src/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/src/favicons/favicon-16x16.png">
  <link rel="manifest" href="/src/favicons/site.webmanifest">
  <link rel="mask-icon" href="/src/favicons/safari-pinned-tab.svg" color="#34343c">
  <link rel="shortcut icon" href="/src/favicons/favicon.ico">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-config" content="/src/favicons/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/slickscrolljs@2.0.2/dist/slickscroll.node.min.js"></script>
</head>

<body>
  <div class="bgVideoWrapper">
    <div class="loading-spinner"></div>
    <video autoplay muted loop id="bgVideo">
      <source src="src/welcomebgvid_compressed.mp4" type="video/mp4">
    </video>
  </div>
  <div class="contentOutline"><div class="contentWrapper">
  <div class="navbar">
    <div class="navbar-left">
      <a href="#about">About Us</a>
      <a href="#projects">Our Projects</a>
    </div>
    <div class="navbar-mid">
      <h2>KAISER</h2>
      <p>Robotics</p>
    </div>
    <div class="navbar-right">
      <a href="#sponsors">Sponsors</a>
      <a href="#contact">Contact Us</a>
      <button id="navbar-extend" aria-controls="dropdown-fullscreen" aria-expanded="false">

      <svg stroke="var(--text)" fill="none" class="hamburger" viewBox="-10 -10 120 120">
        <path class="line" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="m 20 40 h 60 a 1 1 0 0 1 0 20 h -60 a 1 1 0 0 1 0 -40 h 30 v 70">
        </path>
      </svg>
        
      </button>
    </div>
  </div>

  <div class="welcomeWrapper">
  <img id="welcomeImg" src="src/kaiser-colour-rgb.png">
  <p><span>Team 6989</span></p>
  <h1><span class="reveal">More than robots.</span></h1>
  <a href="#about" ><span>Discover More <i class="fa-solid fa-arrow-down"></i></span></a>
  </div>

  <section id="about">
    <h2>Who are we?</h2>
  </section>
    
  </div></div>
  <div id="dropdown-fullscreen">
    <a href="#about"><span>About Us</span></a>
    <a href="#projects"><span>Our Projects</span></a>
    <a href="#sponsors"><span>Sponsors</span></a>
    <a href="#contact"><span>Contact Us</span></a>
  </div>

<script>
  const button = document.getElementById("navbar-extend");
  const dropdown = document.getElementById("dropdown-fullscreen");
  
  button.addEventListener("click", () => {
    const currentState = button.getAttribute("data-state");

    if (!currentState || currentState === "closed") {
      button.setAttribute("data-state", "opened");
      button.setAttribute("aria-expanded", "true");
      dropdown.classList.add("open");
      
    } else {
      button.setAttribute("data-state", "closed");
      button.setAttribute("aria-expanded", "false");
      dropdown.classList.remove("open");
    }
  });
</script>

<script>
  const slick = new slickScroll.default({
      root: "body"
  });

  document.body.style.overflowX = "hidden";
</script>
</body>
</html>
